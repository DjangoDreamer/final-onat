<!DOCTYPE html>
<html>
<head>
  <title>My CSS Art Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>My CSS Art Gallery</h1>

  <div class="gallery">

    <!-- Card 1 -->
    <div class="art-card">
      <div class="art-canvas">
        <img src="tungtung.jpg" class="gallery-img" alt="Sahur">
      </div>
      <h3>tungtung</h3>
    </div>

    <!-- Card 2 -->
    <div class="art-card">
      <div class="art-canvas">
        <img src="tong.jpg" class="gallery-img" alt="Chicken">
      </div>
      <h3>Chicken</h3>
    </div>

    <!-- Card 3 -->
    <div class="art-card">
      <div class="art-canvas">
        <img src="Lazada.jpg" class="gallery-img" alt="Lazadaa">
      </div>
      <h3>Lazadaa</h3>
    </div>

    <!-- Card 4 -->
    <div class="art-card">
      <div class="art-canvas">
        <img src="Skib.jpg" class="gallery-img" alt="Toilet">
      </div>
      <h3>Toilet</h3>
    </div>

  </div>

</body>
</html>
